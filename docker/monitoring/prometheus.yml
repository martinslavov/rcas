global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: rcas
    metrics_path: /app/actuator/prometheus
    static_configs:
      - targets: ["rcas:8080"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
