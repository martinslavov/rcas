name: rcas
services:
  # ------------------------------
  # Citus coordinator (PostgreSQL-compatible endpoint for the application)
  # ------------------------------
  postgres-coordinator:
    image: citusdata/citus:13.2.0-pg15
    platform: linux/amd64
    container_name: postgres-coordinator
    command:
      - postgres
      - -c
      - autovacuum_naptime=30s
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - autovacuum_vacuum_cost_limit=400
      - -c
      - autovacuum_vacuum_cost_delay=5ms
      - -c
      - log_autovacuum_min_duration=250ms
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      # For this local-only Compose cluster, workers authenticate over the private bridge network.
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
      rcas-docker-network:
        aliases:
          - postgres
          - citus-coordinator
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - citus-coordinator-data:/var/lib/postgresql/data
    depends_on:
      postgresql-node1:
        condition: service_healthy
      postgresql-node2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgresql-node1:
    image: citusdata/citus:13.2.0-pg15
    platform: linux/amd64
    container_name: postgresql-node1
    command:
      - postgres
      - -c
      - autovacuum_naptime=30s
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - autovacuum_vacuum_cost_limit=400
      - -c
      - autovacuum_vacuum_cost_delay=5ms
      - -c
      - log_autovacuum_min_duration=250ms
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
      rcas-docker-network:
        aliases:
          - citus-worker-1
    volumes:
      - citus-worker-1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgresql-node2:
    image: citusdata/citus:13.2.0-pg15
    platform: linux/amd64
    container_name: postgresql-node2
    command:
      - postgres
      - -c
      - autovacuum_naptime=30s
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - autovacuum_vacuum_cost_limit=400
      - -c
      - autovacuum_vacuum_cost_delay=5ms
      - -c
      - log_autovacuum_min_duration=250ms
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
      rcas-docker-network:
        aliases:
          - citus-worker-2
    volumes:
      - citus-worker-2-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  citus-init:
    image: citusdata/citus:13.2.0-pg15
    platform: linux/amd64
    container_name: rcas-citus-init
    environment:
      PGHOST: postgres-coordinator
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: testdb
    depends_on:
      postgres-coordinator:
        condition: service_healthy
      postgresql-node1:
        condition: service_healthy
      postgresql-node2:
        condition: service_healthy
    networks:
      - rcas-docker-network
    volumes:
      - ./docker/citus/init-rcas-citus.sql:/init/init-rcas-citus.sql:ro
    command:
      - bash
      - -ec
      - psql -v ON_ERROR_STOP=1 -f /init/init-rcas-citus.sql

  citus-test:
    image: citusdata/citus:13.2.0-pg15
    platform: linux/amd64
    profiles: ["test"]
    environment:
      PGHOST: postgres-coordinator
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: testdb
    depends_on:
      citus-init:
        condition: service_completed_successfully
    networks:
      - rcas-docker-network
    volumes:
      - ./docker/citus/test-daily-user-partition.sql:/tests/test-daily-user-partition.sql:ro
    command:
      - bash
      - -ec
      - psql -v ON_ERROR_STOP=1 -f /tests/test-daily-user-partition.sql

  # ------------------------------
  # Local-only pgAdmin desktop mode (profile: db-ui)
  # Set PGADMIN_PASSWORD to a random bootstrap value before starting.
  # ------------------------------
  pgadmin:
    profiles: ["db-ui"]
    image: dpage/pgadmin4:9.19
    container_name: rcas-pgadmin
    networks:
      - rcas-docker-network
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:-}"
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "true"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      citus-init:
        condition: service_completed_successfully

  # ------------------------------
  # Redis
  # ------------------------------
  redis:
    image: redis:7
    container_name: rcas-redis
    networks:
      - rcas-docker-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------------
  # Cache service (requires: gradle bootJar)
  # Started only with: docker compose --profile app up
  # ------------------------------
  rcas:
    profiles: ["app"]
    container_name: rcas
    networks:
      - rcas-docker-network
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      JDK_JAVA_OPTIONS: "-XX:MaxRAMPercentage=75"
      SPRING_PROFILES_ACTIVE: "dev"
      SPRING_R2DBC_URL: "r2dbc:postgresql://postgres-coordinator:5432/testdb"
      SPRING_R2DBC_USERNAME: "test"
      SPRING_R2DBC_PASSWORD: "test"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
      # OTLP export is off by default; `make monitoring-up` enables it (docker/monitoring/monitoring.env)
      LOGGING_CONFIG: "${RCAS_LOGGING_CONFIG:-classpath:log4j2.yaml}"
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "${RCAS_OTLP_TRACING_ENABLED:-false}"
      MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED: "${RCAS_OTLP_LOGGING_ENABLED:-false}"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "${RCAS_TRACING_SAMPLING:-0.1}"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: "http://otel-collector:4318/v1/logs"
      OTEL_SERVICE_NAME: "rcas"
    depends_on:
      postgres-coordinator:
        condition: service_healthy
      citus-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Command, interval, timeout and retries come from the image HEALTHCHECK (Dockerfile).
    # Only the probe frequency during the start period is raised so `make up --wait` does not wait 30 s;
    # Compose requires start_period with start_interval, so it repeats the Dockerfile value.
    healthcheck:
      start_period: 40s
      start_interval: 2s

  # ------------------------------
  # Monitoring (profile: monitoring): OpenTelemetry Collector, Prometheus, Loki, Grafana
  # Started with: make monitoring-up
  # ------------------------------
  otel-collector:
    profiles: ["monitoring"]
    image: otel/opentelemetry-collector:0.116.1
    container_name: rcas-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    networks:
      - rcas-docker-network
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./docker/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - loki

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.0.1
    container_name: rcas-prometheus
    networks:
      - rcas-docker-network
    ports:
      - "9090:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro

  postgres-exporter:
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: rcas-postgres-exporter
    networks:
      - rcas-docker-network
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://test:test@postgres:5432/testdb?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: "/etc/postgres_exporter/queries.yaml"
    volumes:
      - ./docker/monitoring/postgres-exporter-queries.yml:/etc/postgres_exporter/queries.yaml:ro
    depends_on:
      postgres-coordinator:
        condition: service_healthy
      citus-init:
        condition: service_completed_successfully

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.3.2
    container_name: rcas-loki
    networks:
      - rcas-docker-network
    ports:
      - "3100:3100"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.4.0
    container_name: rcas-grafana
    networks:
      - rcas-docker-network
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - postgres-exporter

volumes:
  pgadmin-data:
  citus-coordinator-data:
  citus-worker-1-data:
  citus-worker-2-data:

networks:
  rcas-docker-network:
    name: rcas-docker-network
