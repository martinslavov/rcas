name: Issue Board Tracking

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  add-to-board:
    if: ${{ !contains(github.event.issue.body, '<!-- agent-dashboard -->') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout trusted default-branch automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Add issue to RCAS Tracking board as Backlog or TODO
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          STATUS: ${{ contains(github.event.issue.labels.*.name, 'backlog') && 'Backlog' || 'TODO' }}
        run: |
          project=$(gh api graphql -f query='query { user(login: "martinslavov") { projectV2(number: 1) { id field(name: "Status") { ... on ProjectV2SingleSelectField { id options { id name } } } } } }' --jq '.data.user.projectV2')
          project_id=$(jq -r '.id' <<< "$project")
          field_id=$(jq -r '.field.id' <<< "$project")
          option_id=$(jq -r '.field.options[] | select(.name == env.STATUS) | .id' <<< "$project")
          item_id=$(gh api graphql \
            -f query='mutation($project: ID!, $content: ID!) { addProjectV2ItemById(input: {projectId: $project, contentId: $content}) { item { id } } }' \
            -f project="$project_id" -f content="$ISSUE_NODE_ID" --jq '.data.addProjectV2ItemById.item.id')
          gh api graphql \
            -f query='mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) { updateProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item, fieldId: $field, value: {singleSelectOptionId: $option}}) { projectV2Item { id } } }' \
            -f project="$project_id" -f item="$item_id" -f field="$field_id" -f option="$option_id"

      - name: Seed the orchestrator task-state record
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATE: ${{ contains(github.event.issue.labels.*.name, 'backlog') && 'backlog' || 'todo' }}
        run: |
          # Every issue gets a state record, even when it was not created by the Product Owner.
          # An existing record (seeded by the Product Owner) is not an error.
          if ! out=$(python3 .github/scripts/orchestrator.py init "$ISSUE_NUMBER" --state "$STATE" --agent human 2>&1); then
            if grep -q "already has a task-state record" <<< "$out"; then
              echo "task-state record already exists for #$ISSUE_NUMBER"
            else
              echo "$out" >&2
              exit 1
            fi
          fi
