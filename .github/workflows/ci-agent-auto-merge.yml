name: Agent PR Auto Merge

on:
  status:
  check_suite:
    types: [completed]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: agent-auto-merge-${{ github.event.issue.number || github.event.pull_request.number || github.event.review.pull_request_url || github.event.sha || github.event.check_suite.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event_name == 'status' ||
      github.event_name == 'check_suite' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read
      statuses: read

    steps:
      - name: Checkout trusted default-branch automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Merge only fully validated agent PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          MODE: merge
        run: python3 .github/scripts/copilot_agent_automation.py
